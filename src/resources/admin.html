<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="admin.js" defer></script>
</head>
<body class="container py-4">

<header class="mb-4">
    <h1 class="display-5 fw-bold text-center">Manage Course Resources</h1>
    <a href="list.html" class="btn btn-primary">View Resources</a>
</header>

<main>
    <section class="mb-5">
        <h2 id="form-title" class="fw-bold mb-3">Add Resource</h2>

        <form id="resource-form" class="border p-3">
            <fieldset>
                <legend>Resource Information</legend>

                <input type="hidden" id="resource-id">

                <label for="resource-title" class="form-label">Title</label>
                <input type="text" id="resource-title" class="form-control mb-3" required>

                <label for="resource-description" class="form-label">Description</label>
                <textarea id="resource-description" class="form-control mb-3" rows="5" required></textarea>

                <label for="resource-link" class="form-label">Link</label>
                <input type="url" id="resource-link" class="form-control mb-3" required>

                <button id="add-resource" type="submit" class="btn btn-primary">Save Resource</button>
                <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
            </fieldset>
        </form>
    </section>

    <section>
        <h2 class="fw-bold mb-3">Existing Resources</h2>

        <table id="resources-table" class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Link</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="resources-tbody">
                <tr>
                    <td colspan="4">Loading resources...</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
