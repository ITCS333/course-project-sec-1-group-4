<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Assignments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        header h1 { margin-bottom: 10px; }
        nav a { color: white; text-decoration: none; margin: 0 10px; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        section { background: white; border-radius: 8px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #3498db; }
        #assignment-form fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 20px; }
        #assignment-form legend { padding: 0 10px; font-weight: bold; font-size: 1.1em; color: #2c3e50; }
        #assignment-form label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; color: #555; }
        #assignment-form input, #assignment-form textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 14px; }
        #assignment-form input:focus, #assignment-form textarea:focus { outline: none; border-color: #3498db; }
        #assignment-form textarea { min-height: 100px; resize: vertical; }
        #add-assignment { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 1em; }
        #add-assignment:hover { background: #219a52; }
        #assignments-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        #assignments-table th, #assignments-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        #assignments-table th { background: #34495e; color: white; font-weight: bold; }
        #assignments-table tr:hover { background: #f5f5f5; }
        .edit-btn { background: #3498db; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; margin-right: 5px; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; }
        .edit-btn:hover { background: #2980b9; }
        .delete-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <header>
        <h1>Admin Panel - Manage Assignments</h1>
        <nav>
            <a href="list.html">View Assignments</a>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Add New Assignment</h2>
            <form id="assignment-form" action="#">
                <fieldset>
                    <legend>Assignment Details</legend>
                    
                    <label for="assignment-title">Assignment Title *</label>
                    <input type="text" id="assignment-title" required>
                    
                    <label for="assignment-description">Description *</label>
                    <textarea id="assignment-description" required></textarea>
                    
                    <label for="assignment-due-date">Due Date *</label>
                    <input type="date" id="assignment-due-date" required>
                    
                    <label for="assignment-files">Files (one URL per line)</label>
                    <textarea id="assignment-files" placeholder="https://example.com/file1.pdf&#10;https://example.com/file2.zip"></textarea>
                    
                    <button type="submit" id="add-assignment">Add Assignment</button>
                </fieldset>
            </form>
        </section>
        
        <section>
            <h2>Existing Assignments</h2>
            <table id="assignments-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Due Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assignments-tbody">
                    <tr><td colspan="4" style="text-align: center;">Loading assignments...</td></tr>
                </tbody>
            </table>
        </section>
    </main>
    <script src="admin.js" defer></script>
</body>
</html>
