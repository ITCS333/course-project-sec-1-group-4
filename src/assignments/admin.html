<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Assignments</title>
    <script src="admin.js" defer></script>
</head>
<body>
    <header>
        <h1>Manage Assignments</h1>
    </header>

    <main>
        <section>
            <h2>Add Assignment</h2>
            <form id="assignment-form">
                <fieldset>
                    <legend>Assignment Details</legend>

                    <label for="assignment-title">Title</label>
                    <input type="text" id="assignment-title" required />

                    <label for="assignment-description">Description</label>
                    <textarea id="assignment-description" required></textarea>

                    <label for="assignment-due-date">Due Date</label>
                    <input type="date" id="assignment-due-date" required />

                    <label for="assignment-files">Files</label>
                    <textarea id="assignment-files"></textarea>

                    <button id="add-assignment" type="submit">Add Assignment</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Assignments List</h2>
            <table id="assignments-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Due Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assignments-tbody">
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
