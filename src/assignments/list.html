<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        main { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        section#assignment-list-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        article {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        article h3 { color: #2c3e50; margin-bottom: 10px; }
        article .due-date { color: #e74c3c; font-size: 0.9em; margin: 10px 0; }
        article .description { color: #666; margin: 10px 0; }
        article a { display: inline-block; background: #3498db; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; margin-top: 10px; }
        article a:hover { background: #2980b9; }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>📚 Course Assignments</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="admin.html">Admin Panel</a>
        </nav>
    </header>
    <main>
        <section id="assignment-list-section">
            <div class="loading">Loading assignments...</div>
        </section>
    </main>
    <script src="list.js" defer></script>
</body>
</html>
