<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Board</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../common/styles.css">
    

    <script src="board.js" defer></script>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"> Discussion Board</span>
        </div>
    </nav>

    <main class="container">
        <section class="card shadow-sm mb-5">
            <div class="card-body">
            <h2 class="card-title h4 mb-4"> Start a New Topic</h2>
            <form id="new-topic-form" action="#">

                <fieldset>
                    <legend>New Topic Details</legend>
                    <div class="mb-3">
                        <label for="topic-subject" class="form-label font-weight-bold" >Subject:</label>                    

                    <input id="topic-subject" type="text" class="form-control"
                     placeholder="what is on your mind?" required>
                    </div>

                    <div class="mb-3">
                        <label for="topic-message" class="form-label font-weight-bold">Message:</label>
                    <textarea id="topic-message" rows="6" class="form-control" 
                    placeholder="Describe your topic in detail" required></textarea>
                    </div>

                    <button id="create-topic" type="submit" class="btn btn-primary w-100 ">Create Topic</button>
                </fieldset>
            </form>
            </div>
        </section>

        <section>
            <h2 class="h4 mb-3 text secondary" >All Topics</h2>

            <div id="topic-list-container" class="list-group shadow-sm"></div> 
        </section>
    </main>
</body>
</html>
